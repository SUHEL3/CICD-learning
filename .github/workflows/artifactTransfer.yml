name: Artifact download
on:
  workflow_dispatch:

jobs:
  producer:
    on: ubuntu-latest
    steps:
      - name: creating file
        run: echo "hello artifact" > message.txt
      - name: uploding artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact.txt
          path: message.txt

  consumer:
    on: ubuntu-latest
    needs: producer
    steps: 
      - name: download artifact
        uses: actions/download-artifact@v4
        with: 
          name: artifact.txt
      - name: show content of downloaded artifact.txt
        run: cat artifact.txt
