name: Artifact Demo
on:
  workflow_dispatch:

jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    env: 
      projectName: demonstration of artifact
      version: 1
    steps:
      - name: project information
        run: echo $projectName version : $version
      - name: create file
        run: echo "Hello Artifact" >> message.txt
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with: 
         name: my-file
         path: message.txt
