name: Day 4 challenge lab
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: touch student.txt
      - run: echo "suhel mujawar" > student.txt
      - uses: actions/upload-artifact@v4
        with:
          naem: Student_Info
          path: student.txt

  download:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Student_Info
      - run: echo student.txt

