name: Day 4 practice
on: 
  workflow_dispatch:
    branches:
      - new-feature

jobs:
  runner-inspection:
    runs-on: ubuntu-latest
    steps:
      - name: show data
        run: ls -l
      - name: show user
        run: whoami
      - name: show current directory
        run: pwd
      - name: show os info
        run: cat /etc/os-release
      - name: show files
        run: ls -a
