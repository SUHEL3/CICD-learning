name: My Workflow
on:
   push:
    branches:
      - main
      - master

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: print greeting
        run: echo "Hello World"
  second-job:
    runs-on: ubuntu-latest
    steps:
      - name: copy repo in runner using checkout
        uses: actions/checkout@v4
      - name: check path of copied repo
        run: pwd
      - name: list all items from repo
        run: ls -al
